name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Um push novo na mesma branch cancela a execução anterior — não faz sentido
# esperar o CI de um commit que já foi substituído.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Os testes NÃO tocam o banco: src/env é importado apenas por src/lib/prisma.ts,
      # que os testes substituem por um fake (vi.mock em transacoes.test.ts).
      # Estes valores existem só para `prisma generate` e a validação do env schema
      # não abortarem — nada aqui conecta de fato.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-secret-nao-usado-de-verdade
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # O Prisma Client é gerado, não versionado — precisa vir antes do typecheck.
      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Typecheck (inclui os testes)
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # O frontend ainda não tem ESLint nem testes (ver ADR 0009, que lista o
      # eslint-config-expo como "futuro"). O typecheck é a única rede hoje.
      - name: Typecheck
        run: npx tsc --noEmit
